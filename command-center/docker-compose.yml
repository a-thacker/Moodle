# Command Center stack. Postgres is the source of truth; the backend is the
# only service that talks to it. The assistant runs on the host Claude/Codex
# bridges (subscription), so no local LLM services live here anymore.
#
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host by default — only the backend reaches it over
    # the compose network. Uncomment to inspect with a local client.
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ./backend
      # Use the host network during build so pip can resolve/reach PyPI
      # (this host's BuildKit has flaky DNS on the default build network).
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # All secrets (JWT_SECRET, AGENT_API_KEY, OWNER_*, ...) come from .env;
    # the explicit environment below overrides the DB host for the compose
    # network and supplies non-secret defaults.
    env_file:
      - .env
    # Reach the host's Claude bridge (headless `claude -p` on the subscription).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: ${APP_NAME:-Command Center}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-}
      CODEX_BRIDGE_URL: ${CODEX_BRIDGE_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      VAULT_GIT_TOKEN: ${VAULT_GIT_TOKEN:-}
    # Obsidian vault checkouts live on a named volume (seeded with appuser
    # ownership from the image, so the non-root backend can clone into it).
    # Named volumes persist across `up -d --build` redeploys.
    volumes:
      - vault_data:/vault-data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      # Host network during build so npm can reach the registry (same
      # BuildKit DNS workaround as the backend).
      network: host
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Pi-hole — network-wide DNS ad-blocker, reached over Tailscale. DNS (53) and
  # the admin UI bind to the server's TAILNET ip, so every tailnet device can use
  # it once you set this host as the tailnet's global nameserver in the Tailscale
  # admin console (see the deploy notes). Binding to the tailnet ip rather than
  # 0.0.0.0 deliberately avoids the systemd-resolved stub that already holds
  # 127.0.0.53:53 on this host — so there's nothing to disable.
  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped
    # PIHOLE_HOST_IP is the server's tailnet ip; the default matches this box.
    ports:
      - "${PIHOLE_HOST_IP:-100.112.182.2}:53:53/tcp"
      - "${PIHOLE_HOST_IP:-100.112.182.2}:53:53/udp"
      - "${PIHOLE_HOST_IP:-100.112.182.2}:8053:80/tcp"  # admin UI: http://<tailnet-ip>:8053/admin
    environment:
      TZ: ${TIMEZONE:-America/New_York}
      # Pi-hole v6 config (FTLCONF_*). Password + upstreams live in .env.
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-}
      FTLCONF_dns_upstreams: "${PIHOLE_UPSTREAMS:-1.1.1.1;1.0.0.1}"
      # Answer queries arriving from other subnets (the tailnet), not just local.
      FTLCONF_dns_listeningMode: "all"
    # Config + gravity DB persist in the git-excluded data dir (survives
    # redeploys; the container runs as root so bind-mount ownership is fine).
    volumes:
      - ./data/pihole:/etc/pihole
    cap_add:
      - SYS_NICE  # optional; lets FTL raise its scheduling priority

volumes:
  # Obsidian vault git checkouts (read by the backend; source of truth is git).
  vault_data:
