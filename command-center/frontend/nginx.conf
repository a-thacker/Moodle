# Serves the SPA and proxies the API to the backend container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API → backend service on the compose network. No trailing slash on
    # proxy_pass, so /api/v1/... is forwarded to the backend unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths serve index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA control files must never be cached, or clients get stuck on an old
    # build: the browser re-checks sw.js on every load to find new versions.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        # nginx's default mime map has no .webmanifest entry, so set it here or
        # the browser gets application/octet-stream and may refuse to install.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
