<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint into the notch/safe areas when
         launched standalone; the app pads for env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Standalone PWA chrome. iOS ignores the manifest's display mode, so
         these Apple-specific tags are what make it launch full-screen. -->
    <meta name="theme-color" content="#161826" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Blank home-screen label on iOS (U+2800 Braille blank). -->
    <meta name="apple-mobile-web-app-title" content="&#x2800;" />

    <title>Command Center</title>
    <!-- Fonts + Phosphor icons are self-hosted (bundled via src/fonts.ts) so the
         app has no runtime CDN dependency and works offline. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
